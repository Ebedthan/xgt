[package]
name = "xgt"
version = "1.1.1"
edition = "2021"
authors = ["Anicet Ebou <anicet.ebou@gmail.com>"]
description = "xgt enables efficient querying and parsing of GTDB data"
homepage = "https://github.com/Ebedthan/xgt"
categories = ["command-line-utilities"]
keywords = ["bioinformatics"]
rust-version = "1.85"
repository = "https://github.com/Ebedthan/xgt"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
dirs = "6.0.0"
hex = "0.4"
indicatif = "0.18"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
ureq = { version = "3.3.0", features = ["json", "native-tls"] }

[dev-dependencies]
mockito = "1.7"
tempfile = "3.27"

[profile.release]
opt-level = 3
debug = true
overflow-checks = false
lto = 'thin'
panic = 'abort'
incremental = false

[[bin]]
name = "xgt"
path = "src/main.rs"
bench = false

[features]
integration-tests = []

[[test]]
name = "integration"
path = "test/integration.rs"
required-features = ["integration-tests"]

[lib]
name = "xgt"
path = "src/lib.rs"
